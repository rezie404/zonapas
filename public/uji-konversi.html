<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><title>Uji Konversi DOCX ke PDF</title></head>
<body>
<h1>Uji Konversi DOCX ke PDF</h1>
<pre id="log">Memulai...</pre>
<script type="module">
const log = (s) => { document.getElementById('log').textContent += '\n' + s; };
try {
  log('1. Memuat rekap-laporan.mjs (?v=6, anti-cache)...');
  const { buildDocx, buildPdf } = await import('/rekap-laporan.mjs?v=6');
  log('2. Mengambil data 8 Nov 2026 (fetch JSON lokal)...');
  const res = await fetch('/uji-data-8nov.json');
  const data = await res.json();
  const rows = data.rows.map(r => ({ ...r, judul: r.title }));
  const d = { date: data.date, nihil: data.nihil, rows };
  log('3. Membangun DOCX...');
  const blobDocx = await buildDocx(d);
  log('   DOCX: ' + blobDocx.size + ' byte, type=' + blobDocx.type);
  log('4. Memuat pustaka dari CDN (JSZip, docx-preview, html2pdf via <script>)...');
  const muatScript = (src) => new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src; s.onload = resolve; s.onerror = () => reject(new Error('gagal memuat ' + src));
    document.head.appendChild(s);
  });
  const t0 = Date.now();
  await muatScript('https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js');
  await muatScript('https://cdn.jsdelivr.net/npm/docx-preview@0.3.5/dist/docx-preview.min.js');
  await muatScript('https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js');
  log('   CDN dimuat dalam ' + (Date.now() - t0) + ' ms. JSZip=' + typeof window.JSZip + ', docx=' + typeof window.docx + ', renderAsync=' + typeof (window.docx && window.docx.renderAsync) + ', html2pdf=' + typeof window.html2pdf);
  const renderAsync = window.docx.renderAsync;
  const html2pdf = window.html2pdf;
  log('   html2pdf=' + typeof html2pdf);
  log('5. Merender DOCX ke HTML (docx-preview)...');
  const wadah = document.createElement('div');
  // UJI: wadah di alur normal dokumen (terlihat penuh) untuk memastikan
  // apakah html2canvas memang bisa menangkap isi render docx-preview.
  wadah.style.cssText = 'width:210mm;background:#fff;margin:0 auto;';
  document.body.appendChild(wadah);
  await renderAsync(blobDocx, wadah, null, { breakPages: true });
  const halaman = wadah.querySelectorAll('section.docx, .docx-page').length;
  log('   Render selesai. Panjang HTML wadah: ' + wadah.innerHTML.length + ' karakter.');
  log('   Jumlah section.docx: ' + halaman + '; tinggi wadah: ' + wadah.offsetHeight + 'px.');
  log('6. Mengonversi HTML ke PDF (html2pdf)...');
  const pdf = await html2pdf().set({
    margin: 0,
    filename: 'laporan.pdf',
    image: { type: 'jpeg', quality: 0.98 },
    html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff' },
    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
    pagebreak: { mode: ['css', 'legacy'] },
  }).from(wadah).outputPdf('blob');
  log('   PDF hasil konversi: ' + pdf.size + ' byte, type=' + pdf.type);
  // Simpan salinan PDF konversi agar bisa diperiksa isinya.
  window.__pdfUji = pdf;
  const tautan = document.createElement('a');
  tautan.href = URL.createObjectURL(pdf);
  tautan.download = 'uji-konversi-8nov2026.pdf';
  tautan.textContent = 'Unduh PDF hasil konversi (uji)';
  tautan.style.cssText = 'position:fixed;left:8px;top:8px;z-index:10000;background:#fff;color:#00f;font-size:18px;opacity:1;';
  document.body.appendChild(tautan);
  log('7. Membandingkan dengan buildPdf()...');
  const pdf2 = await buildPdf(d);
  log('   buildPdf(): ' + pdf2.size + ' byte, type=' + pdf2.type);
  log('SELESAI. Jika PDF konversi jauh lebih besar dari buildPdf dan mengandung gambar, konversi BERHASIL.');
} catch (e) {
  log('GAGAL: ' + (e && e.name ? e.name + ': ' : '') + (e && e.message ? e.message : String(e)));
  log('Stack: ' + (e && e.stack ? String(e.stack).split('\n').slice(0, 5).join(' | ') : '-'));
}
</script>
</body>
</html>
