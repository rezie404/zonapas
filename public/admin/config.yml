# Konfigurasi Decap CMS untuk ZonaPas (zonapas.web.id)
# Repo, proxy OAuth, dan Client ID sudah terisi dan aktif.

backend:
  name: github
  repo: rezie404/zonapas
  branch: main
  # Proxy OAuth (Cloudflare Workers) — melayani callback https://oauth.zonapas.web.id/callback.
  base_url: https://oauth.zonapas.web.id
  # Client ID dari GitHub OAuth App "ZonaPas CMS".
  app_id: Ov23liQ7wMCu80EyjHzN
  auth_scope: repo

# Situs tidak memakai workflow draf/review: simpan di CMS langsung tayang.
publish_mode: simple
editorial_workflow: false

site_url: https://zonapas.web.id
display_url: https://zonapas.web.id
logo_url: /images/logo-zonapas.png
locale: id

media_folder: public/images
public_folder: /images

collections:
  - name: berita
    label: Berita
    label_singular: Berita
    folder: src/content/berita
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    summary: "{{title}} ({{category}} — {{upt}})"
    fields:
      - { name: title, label: Judul, widget: string }
      - { name: summary, label: Ringkasan, widget: text }
      - name: category
        label: Kategori
        widget: select
        default: "Umum"
        options:
          - Pembinaan
          - Pengamanan
          - Pelayanan
          - Integrasi & Remisi
          - Kepegawaian
          - Sinergi
          - Kegiatan UPT
          - Pengembangan Kompetensi
          - Edukasi
          - Pembimbingan
          - Sosial
          - Umum
      - { name: tags, label: Tag, widget: list, required: false }
      - { name: author, label: Penulis, widget: string, default: "Rezie" }
      - { name: publishDate, label: Tanggal Terbit, widget: datetime, date_format: YYYY-MM-DD, time_format: false, default: "" }
      - { name: image, label: Foto Sampul, widget: image }
      - { name: imageCaption, label: Keterangan Foto, widget: string, default: "Dokumentasi kegiatan. (ZonaPas)" }
      - { name: featured, label: Tampilkan sebagai Headline, widget: boolean, required: false, default: false }
      - { name: breaking, label: Breaking News, widget: boolean, required: false, default: true }
      - name: upt
        label: UPT Terkait
        widget: select
        required: false
        options:
          - Semua UPT Pemasyarakatan Bengkulu
          - Kanwil Ditjenpas Bengkulu
          - Lapas Kelas IIA Bengkulu
          - Lapas Kelas IIA Curup
          - Lapas Kelas IIB Arga Makmur
          - Lapas Perempuan Kelas IIB Bengkulu
          - LPKA Kelas II Bengkulu
          - Rutan Kelas IIB Bengkulu
          - Rutan Kelas IIB Manna
          - Bapas Kelas I Bengkulu
      # Kota (Nov 2026): wajib diisi di Kelola Berita — nama kota masuk
      # tebal di awal narasi ("**Bengkulu** – ..."). Decap tidak melewati
      # penegakan Worker, jadi kota dicatat di frontmatter (dipakai
      # validasi pasca-commit/reconciler); pilih "Lainnya" lalu isi
      # "Kota Lainnya" bila kotanya tidak ada di daftar.
      - name: kota
        label: Kota
        widget: select
        default: "Bengkulu"
        required: true
        options:
          - Bengkulu
          - Bengkulu Selatan
          - Rejang Lebong
          - Bengkulu Utara
          - Kaur
          - Seluma
          - Mukomuko
          - Lebong
          - Kepahiang
          - Bengkulu Tengah
          - Lainnya
      - { name: kota_lainnya, label: Kota Lainnya (isi bila pilih "Lainnya"), widget: string, required: false }
      # ID JurnalPas (D12, 13 Nov 2026): disembunyikan dari editor, tapi
      # WAJIB ada di config supaya Decap mempertahankannya saat mengedit
      # artikel yang sudah tersinkron — tanpa field ini Decap membuang
      # jurnalpas_id dari frontmatter dan artikel putus dari JurnalPas
      # (sama seperti B2 di jalur Worker).
      - { name: jurnalpas_id, label: ID JurnalPas, widget: hidden, required: false }
      - { name: source, label: Sumber Artikel, widget: hidden, default: "zonapas" }
      - { name: body, label: Isi Berita, widget: markdown }

  # ZonaPasTV: video YouTube redaksi (tayang di beranda).
  # Video disimpan di YouTube — isi dengan tautan video (watch / youtu.be / Shorts).
  - name: video
    label: Video ZonaPasTV
    label_singular: Video ZonaPasTV
    folder: src/content/video
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    summary: "{{title}} ({{publishDate}})"
    fields:
      - { name: title, label: Judul Video, widget: string }
      - { name: description, label: Deskripsi, widget: text, required: false }
      - { name: video, label: Tautan YouTube, widget: string, hint: "Tempel tautan video YouTube (watch, youtu.be, atau Shorts)" }
      - { name: poster, label: Poster / Sampul Video, widget: image, required: false }
      - { name: publishDate, label: Tanggal Tayang, widget: datetime, date_format: YYYY-MM-DD, time_format: false, default: "" }
      - { name: author, label: Pengunggah, widget: string, default: "Rezie" }
