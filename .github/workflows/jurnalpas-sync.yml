# Sync ke JurnalPas — setiap artikel yang terbit di ZonaPas otomatis terbit juga
# di jurnalpas.wordpress.com (dan editan artikel yang sudah punya jurnalpas_id
# memperbarui post yang sama, bukan membuat duplikat).
#
# Cara kerja: scripts/jurnalpas-sync.mjs (Node, tanpa dependensi).
# Token OAuth2 WordPress.com diambil dari secret WP_COM_ACCESS_TOKEN.
# Bila secret belum dipasang, skrip GAGAL (exit 1) — bukan dry-run diam-diam —
# kecuali bila dijalankan eksplisit dengan --dry-run.
#
# Dijalankan manual (workflow_dispatch) juga bisa: tanpa SHA before/after,
# skrip menganggap semua artikel diubah — yang ber-ID diperbarui, yang tanpa
# ID dilewati (aman dari duplikat).
name: Sync ke JurnalPas

on:
  push:
    branches: [main]
    paths:
      - 'src/content/berita/*.md'
  workflow_dispatch:

permissions:
  contents: write # untuk commit kembali jurnalpas_id (dengan [skip ci])

concurrency:
  group: jurnalpas-sync
  cancel-in-progress: false # antrekan berurutan supaya tidak ada dobel-terbit

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # perlu riwayat untuk git diff before/after

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Sinkronkan artikel ke JurnalPas
        env:
          WP_COM_ACCESS_TOKEN: ${{ secrets.WP_COM_ACCESS_TOKEN }}
          WP_SITE: jurnalpas.wordpress.com
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_EVENT_AFTER: ${{ github.event.after }}
        run: node scripts/jurnalpas-sync.mjs

      # Kirim notifikasi email artikel baru ke pelanggan ZonaPas (Resend).
      # Hanya berjalan bila langkah sync berhasil; daftar artikel baru dibaca
      # dari .github/notify-created.json yang ditulis skrip sync. Langkah ini
      # tidak boleh menggagalkan workflow: skrip dirancang selalu exit 0
      # bila notifikasi yang gagal, dan continue-on-error adalah sabuk
      # pengaman lapis kedua.
      - name: Kirim notifikasi email pelanggan
        continue-on-error: true
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          LANGGANAN_SYNC_TOKEN: ${{ secrets.LANGGANAN_SYNC_TOKEN }}
        run: node scripts/kirim-notifikasi.mjs
